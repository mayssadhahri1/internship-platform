services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: internships
      POSTGRES_USER: internships
      POSTGRES_PASSWORD: internships
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U internships"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/internships
      DB_USER: internships
      DB_PASSWORD: internships
      CORS_ORIGINS: http://localhost:4200
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "4200:80"

volumes:
  pgdata:

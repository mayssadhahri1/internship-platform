spring:
  application:
    name: internship-platform
  datasource:
    url: ${DB_URL:jdbc:h2:mem:internships;DB_CLOSE_DELAY=-1}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

app:
  jwt:
    # Clé de 256 bits minimum, à remplacer en production via JWT_SECRET
    secret: ${JWT_SECRET:ZGV2LXNlY3JldC1rZXktZm9yLWludGVybnNoaXAtcGxhdGZvcm0tMjAyNw==}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:4200}
  seed-demo-data: ${SEED_DEMO_DATA:true}

management:
  endpoints:
    web:
      exposure:
        include: health
